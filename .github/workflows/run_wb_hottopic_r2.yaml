# 工作流名称（自定义，会显示在Actions页面）
name: wb_hottopic_r2

# 全局设置东八区时区
env:
  TZ: Asia/Shanghai

# 触发条件：支持手动触发（方便测试）。定时任务：每10分钟运行一次,github action不准时，延后几个小时，改由render触发 
on: workflow_dispatch 


# 要执行的任务集合
jobs: 
  wb_hottopic_r2: 
    runs-on: ubuntu-latest
    steps:
      # 步骤1：拉取仓库代码（带完整历史，方便提交）
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 关键：拉取完整的仓库历史，否则无法提交

      # 步骤2：配置Python环境
      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 步骤3：安装依赖包
      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 步骤4：运行Python脚本（生成日志文件）
      - name: 执行脚本
        env:
          # GitHub内置CI环境变量，代码中 os.getenv("CI") 自动为true
          RUN_ON_CI: true
          # 下面4个R2密钥，需要你在仓库Secrets提前配置
          ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
          ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS_KEY }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
        run: python get_hottopic_once.py
