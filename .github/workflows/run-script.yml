# 工作流名称（自定义，会显示在Actions页面）
name: test1

# 触发条件：1. 每5分钟运行一次 2. 支持手动触发（方便测试）
on:
  schedule:
    # cron表达式：分 时 日 月 周，*/5 表示每5分钟
    - cron: '*/5 * * * *'
  workflow_dispatch:  # 手动触发开关

# 要执行的任务集合
jobs:
  # 任务名称（自定义）
  run-python-script:
    # 运行环境：选择Ubuntu系统（免费、轻量）
    runs-on: ubuntu-latest
    # 任务步骤
    steps:
      # 步骤1：拉取仓库中的代码到运行环境
      - name: 拉取仓库代码
        uses: actions/checkout@v4  # 复用官方的“拉取代码”插件

      # 步骤2：配置Python环境
      - name: 安装Python
        uses: actions/setup-python@v5  # 复用官方的“配置Python”插件
        with:
          python-version: '3.10'  # 指定Python版本（和脚本兼容即可）

      # 步骤3：安装脚本依赖（比如requests）
      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install requests  # 安装脚本需要的requests库

      # 步骤4：运行Python脚本
      - name: 执行脚本
        run: python test.py  # 运行我们上传的test.py
