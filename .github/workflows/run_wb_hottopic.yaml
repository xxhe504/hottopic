# 工作流名称（自定义，会显示在Actions页面）
name: wb_hottopic

# 授予GITHUB_TOKEN写入仓库的权限
permissions:
  contents: write  # 核心：允许推送代码到仓库

# 全局设置东八区时区
env:
  TZ: Asia/Shanghai

# 触发条件：支持手动触发（方便测试）。定时任务：每10分钟运行一次,github action不准时，延后几个小时，改由阿里云的函数计算触发(https://fcnext.console.aliyun.com/cn-hangzhou/functions)。 
on: workflow_dispatch 

# 要执行的任务集合
jobs: 
  wb_hottopic: 
    runs-on: ubuntu-latest
    steps:
      # 步骤1：拉取仓库代码（带完整历史，方便提交）
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 关键：拉取完整的仓库历史，否则无法提交

      # 步骤2：配置Python环境
      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 步骤3：安装依赖包
      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 步骤4：运行Python脚本-微博
      - name: 执行脚本-微博
        run: python get_hottopic_once.py
      
      # 步骤5：运行Python脚本-知乎
      - name: 执行脚本-知乎
        run: python zhihu_hotsearch.py

      # 步骤6：提交日志文件到GitHub仓库
      - name: 提交日志文件
        run: |
          # 配置Git用户信息（Actions运行环境需要）
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          # 检查是否有新的日志文件变更
          git add .
          # 提交（仅当有变更时才提交，避免空提交）
          git commit -m "Add/Update log file: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          # 推送到仓库
          git push
        env:
          # 使用GitHub内置的TOKEN授权推送（无需手动配置）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


